# Set these to your host values before starting:
#   export UID=$(id -u)
#   export GID=$(id -g)
# or populate them in the local .env file.

services:
  bot:
    build: .
    container_name: yt-bot
    user: "${UID:-1000}:${GID:-1000}"
    profiles: [telegram]
    command: python -u app/bot.py
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./downloads:/downloads:rw
      - ./data:/data:rw
    depends_on:
      - redis

  worker:
    build: .
    container_name: yt-worker
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      DATA_DIR: /data
    command: python -u app/worker.py
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./downloads:/downloads:rw
      - ./data:/data:rw
      - "${ARCHIVE_HOST_PATH:-./archive}:/archive:rw"
    depends_on:
      - redis

  transcription-worker:
    build: .
    container_name: transcription-worker
    user: "${UID:-1000}:${GID:-1000}"
    command: python -u app/transcription_worker.py
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      DOWNLOAD_DIR: /downloads
      WHISPER_MODEL_DIR: /data/whisper-models
      WHISPER_MODEL: small
      WHISPER_CPU_THREADS: "${WHISPER_CPU_THREADS:-4}"
      HF_HOME: /data/huggingface
      HF_HUB_CACHE: /data/huggingface/hub
      HF_XET_CACHE: /data/huggingface/xet
      XDG_CACHE_HOME: /data/huggingface/xdg
      HF_HUB_DISABLE_XET: "1"
    volumes:
      - ./downloads:/downloads:rw
      - ./data:/data:rw
    cpus: "${TRANSCRIPTION_CPUS:-4.0}"
    mem_limit: "${TRANSCRIPTION_MEMORY_LIMIT:-8g}"
    depends_on:
      - redis

  web:
    build: .
    container_name: capture-web
    user: "${UID:-1000}:${GID:-1000}"
    command: ["gunicorn", "--bind", "0.0.0.0:8080", "--workers", "1", "--threads", "4", "--timeout", "30", "app.web:create_app()"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /data
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    volumes:
      - ./downloads:/downloads:rw
      - ./data:/data:rw
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: yt-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no"]
